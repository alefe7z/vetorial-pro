# Gera o Vetorial.exe para Windows (64 bits) só quando o dono pede: em Actions → Gerar EXE →
# Run workflow (escolhendo a branch), ou por uma IA a pedido dele. Enviar código não gera o .exe.
# O .exe fica em Actions → (a execução) → Artifacts → Vetorial-<branch>-windows.
name: Gerar EXE

on:
  workflow_dispatch:

concurrency:
  group: gerar-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Guarda o que já foi compilado: a partir da 2ª vez fica bem mais rápido.
      - uses: Swatinem/rust-cache@v2
        with:
          key: vetorial-windows-x64

      - name: Compilar o Vetorial
        shell: pwsh
        env:
          # Sem dependência do Visual C++ Redistributable no computador do usuário.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked -p vectorcraft --target x86_64-pc-windows-msvc

      - name: Preparar o pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/vectorcraft.exe dist/Vetorial.exe
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE -Destination dist/
          # Nomes de artefato não podem ter "/" (ex.: claude/minha-branch).
          $safe = '${{ github.ref_name }}' -replace '[\\/:*?"<>|]', '-'
          "ARTIFACT=Vetorial-$safe-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/
          if-no-files-found: error
