# Vetorial: checks for the chatgpt branch; no Windows executable is built.
name: Testar correcoes
on:
  push:
    branches: [chatgpt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testar-chatgpt-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  palettes:
    name: Paletas e CDR - testes e clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: chatgpt-color
      - name: Testes de cores, paletas e CDR
        run: cargo test --locked -p vectorcraft-color -p vectorcraft-corel
      - name: Clippy de cores, paletas e CDR
        run: cargo clippy --locked -p vectorcraft-color -p vectorcraft-corel --all-targets -- -D warnings

  project:
    name: Verificacoes completas
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev libudev-dev libfontconfig1-dev libfreetype6-dev libdbus-1-dev libcups2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: chatgpt-ci
          cache-on-failure: true
      - name: Checagens do projeto
        run: cargo xtask ci
